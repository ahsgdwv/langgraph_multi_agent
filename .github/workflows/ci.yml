name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DEEPSEEK_API_KEY: ""
      OPENAI_API_KEY: ""
      AUTH_MODE: dev
      DATABASE_URL: sqlite:///data/ci_app.db
      CHECKPOINT_BACKEND: sqlite
      LOG_JSON: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.lock -r requirements-dev.txt
      - name: Lint correctness-sensitive rules
        run: ruff check .
      - name: Unit and integration tests
        run: pytest
      - name: End-to-end task evaluation
        run: >
          python -m evals.task_eval
          --min-task-success 0.9
          --min-routing-accuracy 0.9
          --min-skill-accuracy 0.9
          --min-term-coverage 0.9
      - name: Legacy smoke suite and demo
        run: python main.py

  security:
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency scanner
        run: pip install pip-audit
      - name: Dependency audit
        run: >
          pip-audit -r requirements.lock --desc
          --ignore-vuln PYSEC-2026-311
          --ignore-vuln PYSEC-2026-3813
          --ignore-vuln PYSEC-2026-3814
          --ignore-vuln PYSEC-2026-3815

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: fmcg
          POSTGRES_USER: fmcg
          POSTGRES_PASSWORD: fmcg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fmcg -d fmcg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_DSN: postgresql://fmcg:fmcg@localhost:5432/fmcg
      DATABASE_URL: postgresql+psycopg://fmcg:fmcg@localhost:5432/fmcg
      VECTOR_BACKEND: pgvector
      EMBEDDING_DIMENSIONS: "384"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.lock -r requirements-dev.txt
      - name: PostgreSQL RLS and pgvector integration
        run: pytest tests/test_postgres_integration.py -q
