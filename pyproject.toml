[project]
name = "fmcg-agent"
version = "0.3.0"
description = "FMCG channel analysis multi-agent workflow"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["data", "reports", ".venv", ".codebase-memory"]

[tool.ruff.lint]
# Start with correctness checks; expand as the legacy modules are cleaned up.
select = ["E9", "F63", "F7", "F82"]
